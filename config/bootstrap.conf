# Reusable user-facing defaults.

SCREENSHOT_DIR="auto"
BLACK_WALLPAPER="/System/Library/Desktop Pictures/Solid Colors/Black.png"
AGENT_LABEL="com.estaid.mac-bootstrap-agent"
AGENT_BUILD_DIR="$HOME/.local/share/mac-bootstrap/agent"
AGENT_LOG_DIR="$HOME/Library/Logs/mac-bootstrap"
AGENT_CONFIG_DIR="$HOME/Library/Application Support/MacBootstrapAgent"

# Native defaults. Set to 0 to skip in apply-defaults.
APPLY_SCREENSHOT_LOCATION=1
APPLY_TEXT_AUTOMATION_DEFAULTS=1
APPLY_CLICK_DESKTOP_DEFAULT=1
APPLY_DOCK_AUTOHIDE=0
DOCK_AUTOHIDE=1
APPLY_BLACK_WALLPAPER=1
# Fresh Agent installs are inert until enabled from MacBootstrapAgent.app.
APP_HOTKEYS_ENABLED=0
SCREENSHOT_CLIPBOARD_WATCH=0
KEEP_AWAKE_ENABLED=0
KEEP_DISPLAY_AWAKE=0
DOCK_ANCHOR_ENABLED=0
DOCK_ANCHOR_DISPLAY_ID=auto

# Optional install candidates. These are never installed by audit/plan/apply-defaults.
# install-plan reports status and official links only.
INSTALL_CANDIDATES=(
  "Raycast"
  "Claude"
  "Microsoft Teams"
  "Slack"
  "Karabiner-Elements"
  "Gureum"
  "LinearMouse"
  "Amphetamine"
)

# Reset-state assumptions. These are audited but not recommended as install work
# for the intended fresh Mac flow.
RESET_STATE_APPS=(
  "Google Chrome"
  "Codex"
)

# Dock labels are localized on Korean macOS. Keep both Korean and English names
# so the scripts can be reused across language settings.
DOCK_KEEP_LABELS=(
  "Finder"
  "앱"
  "Launchpad"
  "Safari"
  "메모"
  "Notes"
  "시스템 설정"
  "System Settings"
  "캘린더"
  "Calendar"
)

DOCK_REMOVE_LABELS=(
  "메시지"
  "Messages"
  "Mail"
  "메일"
  "지도"
  "Maps"
  "사진"
  "Photos"
  "FaceTime"
  "전화"
  "Phone"
  "연락처"
  "Contacts"
  "미리 알림"
  "Reminders"
  "TV"
  "음악"
  "Music"
  "Games"
