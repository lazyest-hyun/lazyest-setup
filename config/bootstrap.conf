# Reusable user-facing defaults.

BLACK_WALLPAPER="/System/Library/Desktop Pictures/Solid Colors/Black.png"
AGENT_REPOSITORY="https://github.com/hyunn515/mac-bootstrap-agent"
AGENT_REF="93c867a897f22dc2027931beff77010d1310723c"

# Native defaults. Set to 0 to skip in apply-defaults.
APPLY_TEXT_AUTOMATION_DEFAULTS=1
APPLY_CLICK_DESKTOP_DEFAULT=1
APPLY_DOCK_AUTOHIDE=0
DOCK_AUTOHIDE=1
APPLY_BLACK_WALLPAPER=1

# Optional install candidates. These are never installed by audit/plan/apply-defaults.
# install-plan reports status and official links only.
INSTALL_CANDIDATES=(
  "Raycast"
  "Claude"
  "Microsoft Teams"
  "Slack"
  "Karabiner-Elements"
  "Gureum"
  "LinearMouse"
  "Amphetamine"
)

# Reset-state assumptions. These are audited but not recommended as install work
# for the intended fresh Mac flow.
RESET_STATE_APPS=(
  "Google Chrome"
  "Codex"
)

# Dock labels are localized on Korean macOS. Keep both Korean and English names
# so the scripts can be reused across language settings.
